<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-labelledby="title">
  <title id="title">3,500 commits, 400 active days, 4 production apps on Android, iOS, Web</title>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#02569B"/>
      <stop offset="1" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .num { font-size: 34px; font-weight: 700; fill: #1F2328; }
    .label { font-size: 11.5px; font-weight: 600; letter-spacing: 1.2px; fill: #57606A; }
    .sub { font-size: 12.5px; fill: #57606A; }
    .tick { font-size: 11px; fill: #57606A; }
    .head { font-size: 13px; fill: #57606A; }
    .year { font-size: 14px; font-weight: 600; fill: #1F2328; }
    .yearval { font-size: 14px; fill: #1F2328; }
  </style>
  <rect x="0.5" y="0.5" width="859" height="199" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="24" y="34" class="head">Private work included</text>
  <text x="836" y="34" class="head" text-anchor="end"></text>
  <g>
    <rect x="24" y="52" width="191" height="112" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="24" y="52" width="191" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="42" y="102" class="num">3,500</text>
    <text x="42" y="128" class="label">COMMITS</text>
    <text x="42" y="148" class="sub">all time</text>
  </g>
  <g>
    <rect x="231" y="52" width="191" height="112" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="231" y="52" width="191" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="249" y="102" class="num">400</text>
    <text x="249" y="128" class="label">ACTIVE DAYS</text>
    <text x="249" y="148" class="sub">days with contributions</text>
  </g>
  <g>
    <rect x="438" y="52" width="191" height="112" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="438" y="52" width="191" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="456" y="102" class="num">4</text>
    <text x="456" y="128" class="label">PRODUCTION APPS</text>
    <text x="456" y="148" class="sub">live in the stores</text>
  </g>
  <g>
    <rect x="645" y="52" width="191" height="112" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="645" y="52" width="191" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="663" y="102" class="num">3</text>
    <text x="663" y="128" class="label">PLATFORMS</text>
    <text x="663" y="148" class="sub">Android · iOS · Web</text>
  </g>
</svg>

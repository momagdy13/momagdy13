name: Update profile stats

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/update-stats.mjs
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build stats card
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node .github/scripts/update-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md assets; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          git commit -m 'chore: update profile stats'
          git push

name: Update profile stats and activity

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours, so the current streak stays fresh
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/update-stats.mjs
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build stats card
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node .github/scripts/update-stats.mjs

      # Same token as the stats card, so the snake also eats private contributions.
      - name: Build snake
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.STATS_TOKEN }}
          outputs: |
            assets/snake-light.svg?color_snake=#02569B&color_dots=#ebedf0,#bbdefb,#64b5f6,#1e88e5,#02569b
            assets/snake-dark.svg?color_snake=#42A5F5&color_dots=#161b22,#0b3a66,#0d5aa7,#1e88e5,#90caf9

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- README.md assets)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          git commit -m 'chore: update profile stats'
          git push
